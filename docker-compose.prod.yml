# Production overrides for AlmaLinux / VPS deployment.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Port mapping is controlled by APP_HOST_PORT in .env (see docker-compose.yml).
# Do NOT add a `ports:` block here — Compose merges port arrays (appends), which
# would bind BOTH 3000 and 3002 and fail when host 3000 is already in use.
#
# Set in .env:
#   APP_HOST_PORT=3002
#   OPENCART_PUBLIC_URL=http://187.127.143.11:8081/

services:
  opencart:
    environment:
      OPENCART_HTTP_SERVER: ${OPENCART_PUBLIC_URL:-http://localhost:8081/}

  app:
    environment:
      NODE_ENV: production

  worker:
    environment:
      NODE_ENV: production
